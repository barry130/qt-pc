<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>轻听音源引擎</title>
  </head>
  <body>
    <!--
      音源引擎页（双音源包架构）：
      - 由 qtres:// 协议内嵌提供（无 CSP 注入 → 可自由动态 import）；
      - __TAURI_INTERNALS__ 由 Tauri 注入（withGlobalTauri 仍为 false，不用全局 API）；
      - 数据音源包（meta-bundle.js）：qtres 内嵌随应用分发，提供搜索/歌单/榜单/
      歌词/封面等全部低风险接口 —— 永远可用，与是否安装播放包无关；
      - 播放音源包（play-bundle.js）：用户在「设置 → 音源包管理」从链接安装，
      可多包共存、其一生效；本页用 installPlayPack 在同一 JS 上下文里求值装配，
      换包 = Rust 广播 source-pack-changed → 本页热切换，不需要重启应用；
      - 未安装播放包 ≠ 引擎失败：数据接口照常工作，仅取链入口按统一口径报错
      （主窗口据此引导去设置页安装，见 client.ts / PLAY_PACK_MISSING_MESSAGE）；
      - 主窗口侧封装见 src/source-engine/client.ts。
    -->
    <script type="module">
      "use strict";

      const internals = await waitInternals();
      const invoke = internals.invoke.bind(internals);
      const transformCallback = internals.transformCallback.bind(internals);

      /** 主窗口事件目标（emit_to 用 AnyLabel；对齐 @tauri-apps/api emitTo） */
      const MAIN_TARGET = { kind: "AnyLabel", label: "main" };

      /** 冒烟探针（已知免费歌）——与 scripts/smoke-bundle.mjs 同一首 */
      const SMOKE_SONG = {
        id: "1901371647",
        name: "孤勇者",
        singer: "陈奕迅",
        album: "",
        picUrl: "",
        interval: 0,
      };

      /** meta 注册出的数据入口（搜索/歌单/…/installPlayPack/getPlayUrl） */
      let entries = null;
      /** 当前已装配的播放包（null = 未装配） */
      let activePack = null;
      /** 装配失败原因（装配成功后清空；不阻断数据接口） */
      let packError = null;
      /** 页面生命周期：booting → ready | error（仅 meta 自身加载失败才 error） */
      let phase = "booting";
      let phaseDetail = null;

      async function waitInternals() {
        for (let i = 0; i < 100; i++) {
          const api = window.__TAURI_INTERNALS__;
          if (api && typeof api.invoke === "function") return api;
          await new Promise((r) => setTimeout(r, 50));
        }
        throw new Error("__TAURI_INTERNALS__ 注入失败");
      }

      async function emitToMain(event, payload) {
        try {
          await invoke("plugin:event|emit_to", {
            target: MAIN_TARGET,
            event,
            payload,
          });
        } catch {
          // 主窗口不在：无对策，引擎继续自持
        }
      }

      function packSnapshot() {
        return activePack
          ? { id: activePack.id, name: activePack.name, version: activePack.version, code: activePack.code }
          : null;
      }

      function report(phase, extra) {
        return emitToMain("source-engine-status", {
          phase,
          pack: packSnapshot(),
          ...(extra || {}),
        });
      }

      /** 读 v2 安装状态（source_install.rs）：{packs:[…], activeId, …} */
      async function readState() {
        try {
          const state = await invoke("source_state");
          if (!state || !Array.isArray(state.packs)) return null;
          return state;
        } catch {
          return null;
        }
      }

      /** 本地 chain.json 覆盖层（开发/调链用；无则用播放包内置默认链） */
      async function chainOverlay() {
        try {
          const overlay = await invoke("source_chain_overlay");
          return typeof overlay === "string" && overlay.trim() ? overlay : null;
        } catch {
          return null;
        }
      }

      /**
       * 装配当前生效的播放包（boot 与每次 source-pack-changed 共用）。
       *
       * - 未选生效包 → 卸载引擎内残留并回到「数据可用 / 取链未装」态；
       * - 装配失败 → 上报 source_pack_load_failed（官方包由 Rust 自动回退并
       *   再次广播换包；自定义包保留在列表里等用户处理），数据接口不受影响；
       * - smoke=true 时追加真实取链冒烟（Range 预检走 meta 的 verifyPlayable）。
       */
      async function applyActivePack(state, smoke) {
        const packs = (state && state.packs) || [];
        const pack = packs.find((p) => p && p.id === state.activeId) || null;
        if (!pack) {
          if (entries && typeof entries.uninstallPlayPack === "function") {
            try {
              await entries.uninstallPlayPack({});
            } catch {
              /* 引擎内本就没有包，忽略 */
            }
          }
          activePack = null;
          packError = null;
          return;
        }
        try {
          const res = await fetch(
            "/script/" + encodeURIComponent(String(pack.dir)) + "/play-bundle.js",
            { cache: "no-store" },
          );
          if (!res.ok) throw new Error("播放包文件读取失败: HTTP " + res.status);
          const code = await res.text();
          const installed = JSON.parse(entries.installPlayPack({ code }));
          const overlay = await chainOverlay();
          if (overlay) entries.loadChain(overlay);
          activePack = {
            id: String(pack.id),
            code: Number(pack.versionCode) || 0,
            name: (installed.playPack && installed.playPack.name) || "",
            version: (installed.playPack && installed.playPack.version) || "",
          };
          packError = null;
          // 把装配出的真实名/版本回填给设置页展示（如 chain.11）
          await invoke("source_pack_describe", {
            packId: pack.id,
            name: activePack.name,
            version: activePack.version,
          }).catch(() => {});
          if (smoke) await networkSmoke();
        } catch (err) {
          const detail = String((err && err.message) || err);
          activePack = null;
          packError = detail;
          await invoke("source_pack_load_failed", {
            packId: pack.id,
            error: detail,
          }).catch(() => {});
        }
      }

      /** 真实网络冒烟：取链 + Range 预检（口径与 verifyPlayable 一致） */
      async function networkSmoke() {
        const resolved = JSON.parse(
          await entries.getPlayUrl({
            platform: "wyy",
            id: SMOKE_SONG.id,
            name: SMOKE_SONG.name,
            singer: SMOKE_SONG.singer,
            album: SMOKE_SONG.album,
            quality: "128",
            duration: SMOKE_SONG.interval,
          }),
        );
        if (!resolved || !resolved.url) throw new Error("冒烟取链返回空");
        const checked = JSON.parse(await entries.verifyPlayable({ url: resolved.url }));
        if (!checked || checked.ok !== true) {
          throw new Error("冒烟 Range 预检失败: HTTP " + (checked && checked.status));
        }
        await invoke("source_report", {
          sourceVersionCode: activePack ? activePack.code : 0,
          result: "ok",
          detail: "",
        }).catch(() => {});
      }

      async function boot() {
        await report("booting");
        // 1) 宿主钩子必须先于 meta-bundle 注入（meta 顶层见到 __qtHost 才自注册）
        globalThis.__qtHost = {
          request: (url, options) =>
            invoke("builtin_request", { url, options: options || null }),
          platform: 1103,
        };
        // 2) 内置数据音源包（qtres 内嵌，随应用发版）
        const mod = await import("/meta-bundle.js");
        entries = (mod && mod.__qtEntries) || globalThis.__qtEntries || null;
        if (!entries || typeof entries.bundleInfo !== "function") {
          throw new Error("meta-bundle 数据入口注册失败");
        }
        // 3) 生效播放包（未装 = 数据接口照常，取链按「未安装」口径报错）
        const state = await readState();
        await applyActivePack(
          state,
          new URLSearchParams(location.search).get("smoke") === "1",
        );
        phase = "ready";
        await report("ready", { detail: packError || phaseDetail || null });
      }

      /** 主窗口 RPC：source-engine-request → source-engine-response。
       *  kind "status" = 查询当前生命周期（client 绑定晚于引擎启动也能对齐状态）；
       *  kind "resolve" = 取链（url "" = 失败/未装播放包；line = 本次命中的线路，
       *                    null = 未知；error = 逐线路 trace 或「未安装」口径）；
       *  kind "invoke"  = 数据接口（meta 入口名 + JSON 参数，result 为 JSON 文本）。 */
      async function onRequest(event) {
        const payload = (event && event.payload) || {};
        const requestId = payload.requestId;
        if (typeof requestId !== "number") return;
        if (payload.kind === "status") {
          await emitToMain("source-engine-response", {
            requestId,
            phase,
            code: activePack ? activePack.code : null,
            detail: packError || phaseDetail,
            pack: packSnapshot(),
          });
          return;
        }
        if (payload.kind === "invoke") {
          let result = null;
          let error = null;
          try {
            const name = payload.entry == null ? "" : String(payload.entry);
            const fn = entries ? entries[name] : null;
            if (typeof fn !== "function") throw new Error("入口不存在: " + name);
            result = await fn(payload.args || {});
          } catch (err) {
            error = String((err && err.message) || err);
          }
          await emitToMain("source-engine-response", { requestId, result, error });
          return;
        }
        // 取链统一走 meta 的 getPlayUrl（未装播放包时它按统一口径抛错）：
        // 应答里 url + line（本次命中的线路 {id,name,kind}）；失败带 error =
        // 逐线路 trace（哪条线死链/超时/预算耗尽未跑、跨源兜底有没有跑）或
        // 「未安装播放音源包：…」的安装引导。
        let url = "";
        let line = null;
        let error = null;
        try {
          if (entries && typeof payload.source === "string") {
            const song = payload.song || {};
            const parsed = JSON.parse(
              await entries.getPlayUrl({
                platform: payload.source,
                id: song.id,
                name: song.name,
                singer: song.singer,
                album: song.album,
                quality: payload.quality,
                duration: song.interval,
              }),
            );
            url = parsed.url || "";
            line = parsed.line || null;
          }
        } catch (err) {
          url = "";
          line = null;
          error = String((err && err.message) || err);
        }
        await emitToMain("source-engine-response", { requestId, url, line, error });
      }

      /** Rust 在包列表/生效包变化后广播：热切换播放包，无需重启应用 */
      async function onPackChanged() {
        if (!entries || phase !== "ready") return;
        const state = await readState();
        await applyActivePack(state, true);
        await report("ready", { detail: packError || phaseDetail || null });
      }

      await invoke("plugin:event|listen", {
        event: "source-engine-request",
        target: { kind: "Any" },
        handler: transformCallback(onRequest),
      }).catch(() => {});
      await invoke("plugin:event|listen", {
        event: "source-pack-changed",
        target: { kind: "Any" },
        handler: transformCallback(onPackChanged),
      }).catch(() => {});

      try {
        await boot();
      } catch (err) {
        phase = "error";
        phaseDetail = String((err && err.message) || err);
        await report("error", { detail: phaseDetail }).catch(() => {});
      }
    </script>
  </body>
</html>
