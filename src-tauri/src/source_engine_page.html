<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>轻听音源引擎</title>
  </head>
  <body>
    <!--
      音源引擎页（v3 统一包模型，与 qt-uniappx services/source-engine.uts 同口径）：
      - 由 qtres:// 协议内嵌提供（无 CSP 注入 → 可自由动态 import）；
      - __TAURI_INTERNALS__ 由 Tauri 注入（withGlobalTauri 仍为 false，不用全局 API）；
      - 数据槽（meta）：不再内置基线——数据包（install/<id>/meta-bundle.js，
        首行 __QT_PACK__ 包头）完全在线安装；activeMetaId 指向它时本页动态
        import（?v=versionCode 破缓存）、复验 bundleInfo 契约；未装 = 数据面
        下线（搜索/歌单/歌词等按「未安装」口径报错，本地音乐不受影响）；
        装载失败 → source_meta_load_failed（Rust 回滚/清槽）+ 本页下线数据面；
      - 播放槽（play）：用户安装的播放包（install/<id>/play-bundle.js）多包
        共存、其一生效；本页用 installPlayPack 在 meta 上下文里求值装配，
        换包 = Rust 广播 source-pack-changed → 本页热切换，不需要重启应用；
        生效时跑真实取链冒烟（搜索“晴天”前 5 首任一取链 + Range 预检通过）；
      - 未安装播放包 ≠ 引擎失败：数据接口照常工作，仅取链入口按统一口径报错
        （主窗口据此引导去设置页安装，见 client.ts / PLAY_PACK_MISSING_MESSAGE）；
        同理未安装数据包 ≠ 引擎失败：本地音乐不受影响，主窗口首页全屏引导安装。
      - 主窗口侧封装见 src/source-engine/client.ts。
    -->
    <script type="module">
      "use strict";

      const internals = await waitInternals();
      const invoke = internals.invoke.bind(internals);
      const transformCallback = internals.transformCallback.bind(internals);

      /** 主窗口事件目标（emit_to 用 AnyLabel；对齐 @tauri-apps/api emitTo） */
      const MAIN_TARGET = { kind: "AnyLabel", label: "main" };

      /** 包头注释前缀（与 Rust source_pack_header.rs / qt-sources 同步维护） */
      const PACK_HEADER_PREFIX = "/*__QT_PACK__";
      /** 冒烟口径：搜索“晴天”取前 5 首做候选，任一取链 + Range 预检通过即通过 */
      const SMOKE_SOURCE = "kw";
      const SMOKE_KEYWORD = "晴天";
      const SMOKE_SIZE = 5;
      const SMOKE_ATTEMPTS = 2;

      /** meta 注册出的数据入口（搜索/歌单/…/installPlayPack/getPlayUrl） */
      let entries = null;
      /** meta 槽已装载快照：{id: ""(未装)|包id, code, revision} */
      let metaLoaded = { id: "", code: 0, revision: "" };
      /** 数据包装载失败原因（装载成功/未装时为 null） */
      let metaError = null;
      /** 当前已装配的播放包（null = 未装配） */
      let activePack = null;
      /** 播放包装配失败原因（装配成功后清空；不阻断数据接口） */
      let packError = null;
      /** 页面生命周期：booting → ready | error（仅宿主钩子注入失败才 error） */
      let phase = "booting";
      let phaseDetail = null;

      async function waitInternals() {
        for (let i = 0; i < 100; i++) {
          const api = window.__TAURI_INTERNALS__;
          if (api && typeof api.invoke === "function") return api;
          await new Promise((r) => setTimeout(r, 50));
        }
        throw new Error("__TAURI_INTERNALS__ 注入失败");
      }

      /**
       * 运行时网络收紧（内容安全的第二道闸，与安装期静态扫描互为冗余）：
       * 播放包/数据包在本页上下文里求值执行，若无限制则可以直接用
       * fetch/XHR/WebSocket 绕过 builtin_request 的协议/内网校验自由外联。
       *
       * 放行面（本页自身的运行需要）：
       * - 同源站内路径（"/script/…" 的 fetch 装载）；
       * - Tauri IPC 端点（http(s)://ipc.localhost、ipc:// —— invoke 底层走 fetch）。
       * 其余一律拒绝（全局 fetch、XHR、WebSocket、EventSource、Worker、sendBeacon）。
       */
      function lockDownNetwork() {
        const IPC_PREFIXES = [
          "http://ipc.localhost",
          "https://ipc.localhost",
          "ipc://",
        ];
        const nativeFetch = window.fetch ? window.fetch.bind(window) : null;
        window.fetch = function (input, init) {
          let url = "";
          try {
            url = typeof input === "string" ? input : (input && input.url) || String(input);
          } catch {
            url = "";
          }
          const sameOriginPath = url.startsWith("/") && !url.startsWith("//");
          const isIpc = IPC_PREFIXES.some((p) => url.startsWith(p));
          if (!sameOriginPath && !isIpc) {
            return Promise.reject(
              new Error("音源包环境禁止直接网络请求，请使用 host.request"),
            );
          }
          if (!nativeFetch) return Promise.reject(new Error("fetch 不可用"));
          return nativeFetch(input, init);
        };
        const deny = (name) =>
          function () {
            throw new Error("音源包环境禁止使用 " + name);
          };
        try { window.XMLHttpRequest = deny("XMLHttpRequest"); } catch {}
        try { delete window.WebSocket; } catch {}
        try { delete window.EventSource; } catch {}
        try { delete window.Worker; } catch {}
        try { delete window.SharedWorker; } catch {}
        try { navigator.sendBeacon = undefined; } catch {}
      }
      lockDownNetwork();

      async function emitToMain(event, payload) {
        try {
          await invoke("plugin:event|emit_to", {
            target: MAIN_TARGET,
            event,
            payload,
          });
        } catch {
          // 主窗口不在：无对策，引擎继续自持
        }
      }

      /** 解析包首行 __QT_PACK__ 包头注释（与宿主同口径；不合法返回 null） */
      function parsePackHeader(text) {
        const firstLine = String(text).split("\n")[0] || "";
        if (!firstLine.startsWith(PACK_HEADER_PREFIX) || !firstLine.endsWith("*/")) {
          return null;
        }
        let header = null;
        try {
          header = JSON.parse(firstLine.slice(PACK_HEADER_PREFIX.length, -2));
        } catch {
          return null;
        }
        if (!header || typeof header !== "object") return null;
        const kind = String(header.kind || "");
        const id = String(header.id || "");
        const code = Number(header.versionCode) || 0;
        if (kind !== "meta" && kind !== "play") return null;
        if (!/^[a-z0-9-]{2,32}$/.test(id)) return null;
        if (code < 1) return null;
        return {
          kind,
          id,
          name: String(header.name || ""),
          versionCode: code,
          versionName: String(header.versionName || ""),
        };
      }

      function packSnapshot() {
        return activePack
          ? { id: activePack.id, name: activePack.name, version: activePack.version, code: activePack.code }
          : null;
      }

      function metaSnapshot() {
        return { id: metaLoaded.id, code: metaLoaded.code, revision: metaLoaded.revision || "" };
      }

      function report(phase, extra) {
        return emitToMain("source-engine-status", {
          phase,
          pack: packSnapshot(),
          meta: metaSnapshot(),
          ...(extra || {}),
        });
      }

      /** 读 v3 安装状态（source_install.rs）：{packs:[…], activeId, activeMetaId, …} */
      async function readState() {
        try {
          const state = await invoke("source_state");
          if (!state || !Array.isArray(state.packs)) return null;
          return state;
        } catch {
          return null;
        }
      }

      /** 计算 meta 槽目标：activeMetaId 指向的数据包；未装（url 空串）=
       *  数据面下线，不再是内置基线。包版 URL 带 ?v=versionCode 破 import
       *  缓存（同 id 原位更新后必须重新求值）。 */
      function metaTarget(state) {
        const active = state && typeof state.activeMetaId === "string" ? state.activeMetaId : "";
        if (active) {
          const packs = (state && state.packs) || [];
          const pack = packs.find((p) => p && p.id === active && p.kind === "meta");
          if (pack) {
            const code = Number(pack.versionCode) || 0;
            return {
              id: active,
              code,
              url:
                "/script/" +
                encodeURIComponent(String(pack.dir || pack.id)) +
                "/meta-bundle.js?v=" + code,
            };
          }
        }
        return { id: "", code: 0, url: "" };
      }

      /**
       * 装载 meta 槽（boot 与每次 source-meta-changed 共用）：
       * 未装 → 清空数据面（entries=null，干净态不报错）；装了 → 取目标文本
       * （no-store）→ 包版校验包头身份 → 动态 import → bundleInfo 契约自检
       * （name=meta-bundle 且 hostApiVersion=1）。装载失败抛错由调用方上报。
       */
      async function loadMeta(state) {
        const target = metaTarget(state);
        if (!target.url) {
          entries = null;
          metaLoaded = { id: "", code: 0, revision: "" };
          metaError = null;
          return;
        }
        const res = await fetch(target.url, { cache: "no-store" });
        if (!res.ok) throw new Error("数据包文件读取失败: HTTP " + res.status);
        const text = await res.text();
        if (target.id) {
          const header = parsePackHeader(text);
          if (!header || header.kind !== "meta") {
            throw new Error("数据包包头非法（首行缺少 __QT_PACK__ meta 包头）");
          }
          if (header.id !== target.id) {
            throw new Error("数据包 id 不符: " + header.id);
          }
          target.code = header.versionCode;
        }
        const mod = await import(target.url);
        const e = (mod && mod.__qtEntries) || globalThis.__qtEntries || null;
        if (!e || typeof e.bundleInfo !== "function") {
          throw new Error("meta-bundle 数据入口注册失败");
        }
        const info = JSON.parse(await e.bundleInfo({}));
        if (
          !info ||
          info.name !== "meta-bundle" ||
          Number(info.hostApiVersion) !== 1
        ) {
          throw new Error(
            "数据包契约不符: name=" +
              (info && info.name) +
              " hostApiVersion=" +
              (info && info.hostApiVersion),
          );
        }
        entries = e;
        metaLoaded = {
          id: target.id,
          code: target.code || 0,
          revision: String((info && (info.metaRevision || info.version)) || ""),
        };
        metaError = null;
        await invoke("source_meta_loaded", {
          packId: target.id,
          code: metaLoaded.code,
        }).catch(() => {});
      }

      /** 数据包装载失败 → 上报 + 本页立刻下线数据面（entries 清空，数据接口
       *  按「未安装」口径报错）。Rust 收到后按更新现场回滚 .prev / 清空数据槽
       *  并广播 source-meta-changed，本页 onMetaChanged 装回旧版或进入未装态。 */
      async function metaFailed(state, detail) {
        entries = null;
        metaLoaded = { id: "", code: 0, revision: "" };
        metaError = detail;
        await invoke("source_meta_load_failed", {
          packId: metaTarget(state).id,
          error: detail,
        }).catch(() => {});
      }

      /** 根目录 chain.json 覆盖层（开发/调链用；无则用播放包内置默认链） */
      async function rootChainOverlay() {
        try {
          const overlay = await invoke("source_chain_overlay");
          return typeof overlay === "string" && overlay.trim() ? overlay : null;
        } catch {
          return null;
        }
      }

      /** 播放包自带 chain.json（manifest 分发场景；包内覆盖层优先于根覆盖层） */
      async function packChainOverlay(dir) {
        try {
          const res = await fetch(
            "/script/" + encodeURIComponent(String(dir)) + "/chain.json",
            { cache: "no-store" },
          );
          if (!res.ok) return null;
          const text = await res.text();
          return text.trim() ? text : null;
        } catch {
          return null;
        }
      }

      /**
       * 装配当前生效的播放包（boot / source-pack-changed / meta 重载后共用）。
       *
       * - 未选生效包 → 卸载引擎内残留并回到「数据可用 / 取链未装」态；
       * - 装配失败 → 上报 source_pack_load_failed（更新现场由 Rust 自动回滚
       *   .prev 并广播换包；手动装的包保留在列表里等用户处理）；
       * - smoke=true 时追加真实取链冒烟；通过后 source_pack_verified 收摊更新现场。
       */
      async function applyActivePack(state, smoke) {
        // 数据面未就绪（未装数据包/装载失败）：installPlayPack 与冒烟都依赖
        // meta entries，装配无从谈起——回到「未装配」态且不误报播放包失败。
        if (!entries) {
          activePack = null;
          packError = null;
          return;
        }
        const packs = (state && state.packs) || [];
        const pack = packs.find((p) => p && p.id === state.activeId && p.kind === "play") || null;
        if (!pack) {
          if (entries && typeof entries.uninstallPlayPack === "function") {
            try {
              await entries.uninstallPlayPack({});
            } catch {
              /* 引擎内本就没有包，忽略 */
            }
          }
          activePack = null;
          packError = null;
          return;
        }
        try {
          const res = await fetch(
            "/script/" + encodeURIComponent(String(pack.dir)) + "/play-bundle.js",
            { cache: "no-store" },
          );
          if (!res.ok) throw new Error("播放包文件读取失败: HTTP " + res.status);
          const code = await res.text();
          const installed = JSON.parse(entries.installPlayPack({ code }));
          const overlay =
            (await packChainOverlay(pack.dir)) || (await rootChainOverlay());
          if (overlay) entries.loadChain(overlay);
          activePack = {
            id: String(pack.id),
            code: Number(pack.versionCode) || 0,
            name: (installed.playPack && installed.playPack.name) || "",
            version: (installed.playPack && installed.playPack.version) || "",
          };
          packError = null;
          // 把装配出的真实名/版本回填给设置页展示（如 chain.11）
          await invoke("source_pack_describe", {
            packId: pack.id,
            name: activePack.name,
            version: activePack.version,
          }).catch(() => {});
          if (smoke) await networkSmoke();
          if (smoke) {
            await invoke("source_pack_verified", { packId: pack.id }).catch(() => {});
          }
        } catch (err) {
          const detail = String((err && err.message) || err);
          activePack = null;
          packError = detail;
          await invoke("source_pack_load_failed", {
            packId: pack.id,
            error: detail,
          }).catch(() => {});
        }
      }

      /**
       * 真实取链冒烟（v3 口径）：搜索“晴天”取前 5 首做候选，任一首
       * getPlayUrl + Range 预检通过 = 通过（每首最多 2 次）；候选为空 =
       * 跳过（不下结论）。全部失败抛错 → 上层按更新失败回滚。
       */
      async function networkSmoke() {
        let candidates = [];
        try {
          const searched = JSON.parse(
            await entries.search({
              source: SMOKE_SOURCE,
              keyword: SMOKE_KEYWORD,
              page: 1,
              size: SMOKE_SIZE,
            }),
          );
          const list = searched && Array.isArray(searched.list) ? searched.list : [];
          candidates = list.slice(0, SMOKE_SIZE);
        } catch {
          candidates = [];
        }
        if (!candidates.length) return; // 候选为空：视为通过（不下结论）
        let lastError = "冒烟取链全部失败";
        for (const song of candidates) {
          for (let attempt = 0; attempt < SMOKE_ATTEMPTS; attempt++) {
            try {
              const resolved = JSON.parse(
                await entries.getPlayUrl({
                  platform: String(song.platform || SMOKE_SOURCE),
                  id: song.id,
                  name: song.name,
                  singer: song.singer || "",
                  album: song.album || "",
                  quality: "128",
                  duration: Number(song.interval) || 0,
                }),
              );
              if (!resolved || !resolved.url) throw new Error("取链返回空");
              const checked = JSON.parse(await entries.verifyPlayable({ url: resolved.url }));
              if (!checked || checked.ok !== true) {
                throw new Error("Range 预检失败: HTTP " + (checked && checked.status));
              }
              // 官方播放包上报冒烟结果（manifest 通道的服务端观测）
              if (activePack && activePack.id === "play-official") {
                await invoke("source_report", {
                  sourceVersionCode: activePack.code,
                  result: "ok",
                  detail: "",
                }).catch(() => {});
              }
              return;
            } catch (err) {
              lastError = String((err && err.message) || err);
            }
          }
        }
        throw new Error("冒烟失败（“" + SMOKE_KEYWORD + "”前 " + candidates.length + " 首全部取链失败）：" + lastError);
      }

      async function boot() {
        await report("booting");
        // 1) 宿主钩子必须先于 meta-bundle 注入（meta 顶层见到 __qtHost 才自注册）
        globalThis.__qtHost = {
          request: (url, options) =>
            invoke("builtin_request", { url, options: options || null }),
          platform: 1103,
        };
        // 2) meta 槽：未装 = 数据面下线（干净态）；装载失败 → 上报 + 下线
        const state = await readState();
        try {
          await loadMeta(state);
        } catch (err) {
          const detail = String((err && err.message) || err);
          await metaFailed(state, detail);
          phaseDetail = "数据包装载失败: " + detail;
        }
        // 3) 播放槽（meta 数据面就绪才装配；未装 meta 时取链同样按「未安装」口径报错）
        await applyActivePack(
          state,
          new URLSearchParams(location.search).get("smoke") === "1",
        );
        phase = "ready";
        await report("ready", { detail: packError || metaError || phaseDetail || null });
      }

      /** 主窗口 RPC：source-engine-request → source-engine-response。
       *  kind "status" = 查询当前生命周期（client 绑定晚于引擎启动也能对齐状态）；
       *  kind "resolve" = 取链（url "" = 失败/未装播放包；line = 本次命中的线路，
       *                    null = 未知；referer = 宿主取字节要带的头（空串 = 不发）；
        *                    error = 逐线路 trace 或「未安装」口径）；
       *  kind "invoke"  = 数据接口（meta 入口名 + JSON 参数，result 为 JSON 文本）。 */
      async function onRequest(event) {
        const payload = (event && event.payload) || {};
        const requestId = payload.requestId;
        if (typeof requestId !== "number") return;
        if (payload.kind === "status") {
          await emitToMain("source-engine-response", {
            requestId,
            phase,
            code: activePack ? activePack.code : null,
            detail: packError || metaError || phaseDetail,
            pack: packSnapshot(),
            meta: metaSnapshot(),
          });
          return;
        }
        if (payload.kind === "invoke") {
          let result = null;
          let error = null;
          try {
            const name = payload.entry == null ? "" : String(payload.entry);
            const fn = entries ? entries[name] : null;
            if (typeof fn !== "function") {
              throw new Error(
                entries
                  ? "入口不存在: " + name
                  : "未安装数据包，数据接口不可用（首页可安装）: " + name,
              );
            }
            result = await fn(payload.args || {});
          } catch (err) {
            error = String((err && err.message) || err);
          }
          await emitToMain("source-engine-response", { requestId, result, error });
          return;
        }
        // 取链统一走 meta 的 getPlayUrl（未装播放包时它按统一口径抛错）：
        // 应答里 url + line（本次命中的线路 {id,name,kind}）+ referer（宿主取
        // 字节要带的头，空串 = 不发）+ size/actualQuality（Range 预检实测的
        // 文件总字节数与按实测码率重标后的档位，见《MusicFree 对照》§4 第 3 项）；
        // 失败带 error = 逐线路 trace（哪条线死链/超时/预算耗尽未跑、跨源兜底有没有跑）
        // 或「未安装播放音源包：…」的安装引导。
        let url = "";
        let line = null;
        let error = null;
        // referer：宿主（播放 range_reader / 下载 download.rs）拿这个地址去 CDN
        // 取字节时要带的头，由包按源声明下发；空串 = 不发（宿主不许自己按域名猜）
        let referer = "";
        // size / actualQuality：包侧 Range 预检的实测结果，原样转发给宿主。
        // size 为 null = 本次没读到总长（206 无 content-range、403/416 放行），
        // actualQuality 此时等于请求档 —— 上层按请求档处理，不许自己猜一个。
        let size = null;
        let actualQuality = "";
        if (!entries) {
          error = "未安装数据包，在线播放不可用（首页可安装）";
        }
        try {
          if (entries && typeof payload.source === "string") {
            const song = payload.song || {};
            const parsed = JSON.parse(
              await entries.getPlayUrl({
                platform: payload.source,
                id: song.id,
                name: song.name,
                singer: song.singer,
                album: song.album,
                quality: payload.quality,
                duration: song.interval,
              }),
            );
            url = parsed.url || "";
            line = parsed.line || null;
            referer = typeof parsed.referer === "string" ? parsed.referer : "";
            size = typeof parsed.size === "number" && isFinite(parsed.size) ? parsed.size : null;
            actualQuality = typeof parsed.actualQuality === "string" ? parsed.actualQuality : "";
          }
        } catch (err) {
          url = "";
          line = null;
          referer = "";
          size = null;
          actualQuality = "";
          error = String((err && err.message) || err);
        }
        await emitToMain("source-engine-response", {
          requestId,
          url,
          line,
          error,
          referer,
          size,
          actualQuality,
        });
      }

      /** Rust 在包列表/播放槽变化后广播：热切换播放包，无需重启应用 */
      async function onPackChanged() {
        if (!entries || phase !== "ready") return;
        const state = await readState();
        await applyActivePack(state, true);
        await report("ready", { detail: packError || metaError || phaseDetail || null });
      }

      /** Rust 在数据槽变化后广播（安装/启用/卸载/回滚数据包）：
       *  幂等：目标没变（同 id 同 code）直接跳过；变了则重装 meta 槽 +
       *  在全新 meta 上下文里重装播放包（不再冒烟——播放包此前已验证）。 */
      async function onMetaChanged() {
        if (phase !== "ready") return;
        const state = await readState();
        const target = metaTarget(state);
        if (metaLoaded.id === target.id && metaLoaded.code === target.code && entries) {
          return;
        }
        try {
          await loadMeta(state);
        } catch (err) {
          const detail = String((err && err.message) || err);
          await metaFailed(state, detail);
          phaseDetail = "数据包装载失败: " + detail;
        }
        await applyActivePack(state, false);
        await report("ready", { detail: packError || metaError || phaseDetail || null });
      }

      await invoke("plugin:event|listen", {
        event: "source-engine-request",
        target: { kind: "Any" },
        handler: transformCallback(onRequest),
      }).catch(() => {});
      await invoke("plugin:event|listen", {
        event: "source-pack-changed",
        target: { kind: "Any" },
        handler: transformCallback(onPackChanged),
      }).catch(() => {});
      await invoke("plugin:event|listen", {
        event: "source-meta-changed",
        target: { kind: "Any" },
        handler: transformCallback(onMetaChanged),
      }).catch(() => {});

      try {
        await boot();
      } catch (err) {
        phase = "error";
        phaseDetail = String((err && err.message) || err);
        await report("error", { detail: phaseDetail }).catch(() => {});
      }
    </script>
  </body>
</html>
