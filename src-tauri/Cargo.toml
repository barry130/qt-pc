[package]
name = "quietmusic"
version = "1.0.5"
description = "轻听 PC 版 - 轻量级桌面聚合音乐播放器"
authors = ["QuietMusic"]
edition = "2021"
# rodio 0.22.2 的 MSRV 为 1.87；MSRV 感知解析器会据此挑选依赖版本，必须同步抬高
rust-version = "1.87"

[lib]
name = "quietmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
# 0.22 起 Decoder::builder().with_byte_len() 会把总字节数透传给 symphonia 的
# MediaSource，FLAC 的二分定位不再因 byte_len 缺失而报 Unseekable（进度条拖拽修复）
rodio = { version = "0.22.2", features = ["symphonia-all"] }
# 音频输出设备枚举 / 默认设备变化检测（与 rodio 0.22.2 内置的 cpal 0.17 对齐，不引入新副本）
cpal = "0.17"
# 本地音乐库元数据读取（DESIGN §13）：与 rodio 0.22.2 内置的 symphonia 0.5.5 同版本，不引入新副本
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "ogg", "aac", "isomp4", "vorbis"] }
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.23"
fastrand = "2"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2.7"
# Windows 系统媒体控制（SMTC）：系统媒体面板 + 硬件媒体键 / 蓝牙耳机按键。
# 只有 Windows 会编译到 windows crate；Linux 的 dbus 后端用不到，关掉默认特性。
souvlaki = { version = "0.8.3", default-features = false }

# Windows 任务栏缩略图工具栏（taskbar.rs）：ITaskbarList3::ThumbBarAddButtons +
# GDI 现场生成图标 + 窗口过程替换接收按钮点击。
# 版本与 tauri/wry 已锁定的 windows 0.61.3 对齐，避免引入第二份副本（也无需联网下载）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
