# 轻听（qt-pc）CNB 流水线
#
# 两条流水线：
#   1) master 分支 push  → 前端静态检查（typecheck / 单测 / 前端产物）
#   2) v* tag push       → 在 Linux 构建节点上交叉编译出 x64 / x86 / ARM64 三个
#                          Windows NSIS 安装包，签名后发布到 CNB Release
#
# 为什么走 Linux 交叉编译
# ----------------------
# CNB 的 SaaS 托管节点只有 Linux（cnb:arch:amd64 / arm64），没有 Windows 托管节点，
# 自托管 Windows Runner 需要组织侧开通。Tauri 官方支持在 Linux 上用 cargo-xwin 打
# NSIS 安装包（bundler 源码注释原话："NSIS installers can be built in linux+macOS
# using cargo-xwin"），所以这里用自定义镜像 .cnb/windows-build.Dockerfile：
#   FROM messense/cargo-xwin:0.23.1  +  Node 22  +  pnpm  +  nsis  +  三个 rust target
# MSI/WiX 在 Linux 上无法构建（bundler 里那段是 #[cfg(target_os = "windows")]），
# 因此这里只出 NSIS —— 与仓库原本 bundle.targets: ["nsis"] 一致。
#
# 一次性准备（在 CNB 网页上做）
# ----------------------------
#   1. 组织 canace 下的密钥仓库 qt-secrets 里放 qt-pc.env.yml，发布流水线通过下面的
#      imports: 引用它，把 QT_UPDATE_SIGNING_KEY 注入构建环境。该文件内容：
#        allow_slugs: [- canace/qt-pc]
#        allow_events: [- tag_push]
#        QT_UPDATE_SIGNING_KEY: <本机 .signing/ed25519.key 的 base64>
#      取 base64：
#        [Convert]::ToBase64String([IO.File]::ReadAllBytes("F:\qtMusic\qt-pc\.signing\ed25519.key"))
#      这个私钥对应的公钥必须等于 src-tauri/src/astral.rs 的 UPDATE_SIGN_PUBKEY_B64
#      （"i6+KDVw2olPXumy/qlc9004hhQKMffU/6aUPtcugUCg="），否则应用内更新会验签失败。
#   2. 仓库「设置」里确认已勾选「允许自动触发（云原生构建）」，否则 tag push 不触发流水线。
#
# 触发方式
# --------
#   只有 tag push（v*）会跑发布流水线、产出安装包并挂到 CNB Release；
#   普通分支 push 不构建安装包。
#
# 发布产物（每个都有同名 .sig，必须一起下载）
#   QuietMusic_<version>_x64-setup.exe
#   QuietMusic_<version>_x86-setup.exe
#   QuietMusic_<version>_arm64-setup.exe

# 复用片段：三个架构 job 只有 target/arch/xwin 三个环境变量不同。
# 注意 YAML 的 `<<:` 合并键是浅合并，job 自己写了的键会整体覆盖锚点里的同名键，
# 所以下面每个 job 都完整重写 env（不能指望锚点里的 env 被继承合并）。
.arch-job: &arch-job
  script: |
    set -e
    echo "==> 构建 $QT_ARCH ($QT_TARGET)"
    # Windows AArch64 上 ring 0.17.14 会把 C 编译器强行换成 GNU 驱动 clang
    # （ring/build.rs:562-568 的 FIXME 分支：cc-rs 把 clang-cl 归入 Msvc 家族，
    # is_like_clang() 为 false，于是该分支恒触发），而 cargo-xwin 传进来的仍是
    # clang-cl 风格的 `/imsvc <dir>`；GNU clang 把 /imsvc 当输入文件，直接报
    # `clang: error: no such file or directory: '/imsvc'`。
    # 这里用 .cnb/clang-shim.sh 做垫片，把 clang-cl 方言的参数翻译成 GNU 驱动能懂的写法
    # （/imsvc→-isystem、/FI→-include、-Od→-O0、-W4/-DYNAMICBASE 丢弃…，完整表见该脚本）。
    # 必须同时装成 `clang` 和 `clang-cl` 两个名字：ring 走 `clang`，而 aws-lc-sys 的
    # find_clang_cl() 会把 CC 设成 `clang-cl`（builder/cc_builder.rs:1103-1119），
    # 只装 `clang` 截不到后者 —— 第七次探针实测：/FI 被改写成功了（说明部分调用走了
    # 垫片），但 jitterentropy 那批 `clang-cl` 调用没走垫片，`-Od` 原样落到 GNU 驱动上
    # 报 `error: invalid integral value 'd' in '-Od'`。
    # 只在 aarch64 目标启用：x64/x86 走真 clang-cl，与这条 bug 无关。
    case "$QT_TARGET" in
      aarch64-*)
        QT_REAL_CLANG="$(command -v clang)"
        test -n "$QT_REAL_CLANG"
        install -D -m 0755 .cnb/clang-shim.sh /tmp/clang-shim/clang
        install -D -m 0755 .cnb/clang-shim.sh /tmp/clang-shim/clang-cl
        export QT_REAL_CLANG
        export PATH="/tmp/clang-shim:$PATH"
        echo "==> clang 垫片已启用（clang + clang-cl），转发到 $QT_REAL_CLANG"
        ;;
    esac
    # beforeBuildCommand 用一条无害命令覆盖，不要写成空串也不要删掉这个键：
    # tauri-cli 只要该键有值就会真的去执行，空串交给 sh 的结果是失败；而保留
    # 默认的 `pnpm build` 会让三个并行 job 同时往同一个 dist 目录写。
    # dist 已在上一 stage 构建好，这里让它空跑即可。
    pnpm exec tauri build \
      --runner cargo-xwin \
      --target "$QT_TARGET" \
      --bundles nsis \
      --config '{"build":{"beforeBuildCommand":"echo dist-already-built"}}'
    OUT="$CARGO_TARGET_DIR/$QT_TARGET/release/bundle/nsis"
    ls -l "$OUT"
    # 直接平铺到 artifacts/，不要按架构分子目录：
    # 产物名里已经带 _x64/_x86/_arm64，不会重名；而 cnbcool/attachments 上传后附件名
    # 取的是相对路径，子目录会让 Release 里的资产名变成 "artifacts/x64/xxx.exe"，
    # 下载直链和「安装包同名 .sig」的约定都会对不上。
    mkdir -p artifacts
    cp "$OUT"/*-setup.exe artifacts/
    ls -l artifacts

master:
  push:
    - name: 前端检查
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      git:
        lfs: false
        submodules: false
      docker:
        image: node:22
      ifNewBranch: true
      ifModify:
        - "src/**"
        - "src-tauri/**"
        - "index.html"
        - "package.json"
        - "pnpm-lock.yaml"
        - "vite.config.ts"
        - "tsconfig.json"
        - "app.config.json"
        - ".cnb.yml"
      stages:
        - name: 安装依赖
          script: |
            set -e
            npm install -g pnpm@11.7.0
            pnpm install --frozen-lockfile
        - name: 类型检查与单测
          script: |
            set -e
            pnpm typecheck
            pnpm test
        - name: 前端产物
          script: |
            set -e
            pnpm build
            ls -l dist

v*:
  tag_push:
    - name: Windows 安装包（x64 / x86 / ARM64）
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      git:
        lfs: false
        submodules: false
      lock:
        key: qt-pc-release
        cancel-in-progress: true
      docker:
        build:
          dockerfile: .cnb/windows-build.Dockerfile
          by:
            - .cnb/windows-build.Dockerfile
          versionBy:
            - .cnb/windows-build.Dockerfile
      imports:
        - https://cnb.cool/canace/qt-secrets/-/blob/main/qt-pc.env.yml
      stages:
        - name: 校验 tag 与版本号一致
          script: |
            set -e
            TAG="${CNB_BRANCH#v}"
            VER=$(node -e 'process.stdout.write(require("./app.config.json").version.name)')
            echo "tag=$CNB_BRANCH  app.config.json version=$VER"
            if [ "$TAG" != "$VER" ]; then
              echo "::error::tag($TAG) 与 app.config.json version.name($VER) 不一致，先改版本号再打 tag"
              exit 1
            fi
            # 签名密钥要在最后一步才用上，但三个架构要编 30 分钟以上。
            # 这里先预警，避免等构建全跑完才在「签名安装包」阶段看到失败。
            if [ -z "$QT_UPDATE_SIGNING_KEY" ]; then
              echo "::warning::QT_UPDATE_SIGNING_KEY 未注入 —— 本次会在「签名安装包」阶段失败"
              echo "::warning::请检查密钥仓库 canace/qt-secrets 的 qt-pc.env.yml 是否含 QT_UPDATE_SIGNING_KEY"
              echo "::warning::    值为本机 .signing/ed25519.key 的 base64"
            fi
        - name: 安装依赖并构建前端
          script: |
            set -e
            npm install -g pnpm@11.7.0
            pnpm install --frozen-lockfile
            # 三个架构共用这一份 dist（后续 job 用 --config 把 beforeBuildCommand
            # 改成空跑命令，否则每个 job 都会重新跑一次 pnpm build 并争抢同一个 dist）
            pnpm build
            test -f dist/index.html
            echo "dist 就绪"

        # 三个架构**串行**执行，不要用 jobs 并行。三架构并行探针实测：三个 job 跑在
        # 同一个流水线容器里，会同时往 /root/.cache/cargo-xwin 解包同一批 MSVC SDK
        # 的 MSI，互相踩踏 —— 报 "Failed to setup MSVC CRT / unable to remove invalid
        # unpack dir / failed to splat Win11SDK_10.0.26100_headers.msi"，还有一个 job
        # 被 OOM 杀掉（exit 137）。串行后首个架构解包一次，后续架构直接复用缓存。
        - name: 交叉编译 x64
          <<: *arch-job
          env:
            CARGO_TERM_COLOR: always
            RUST_BACKTRACE: "1"
            QT_ARCH: x64
            QT_TARGET: x86_64-pc-windows-msvc
            XWIN_ARCH: x86_64
            CARGO_TARGET_DIR: /tmp/cargo-target/x64
        - name: 交叉编译 x86
          <<: *arch-job
          env:
            CARGO_TERM_COLOR: always
            RUST_BACKTRACE: "1"
            QT_ARCH: x86
            QT_TARGET: i686-pc-windows-msvc
            XWIN_ARCH: x86
            # i686 必须显式补 SSE2：cc-rs 1.6.0 给 clang-cl 传的是短横线形式的 "-arch:SSE2"，
            # 而 clang-cl 只认 /arch:SSE2；命令行里又带 -Wno-unused-command-line-argument，
            # 于是该参数被静默丢弃，aws-lc-sys 的 internal.h 直接 #error "x86 assembly requires SSE2"。
            # 两个写法都给：不被识别的那个会被 -Wno-unused-command-line-argument 忽略，不影响构建。
            CFLAGS: "-msse2 /arch:SSE2"
            CARGO_TARGET_DIR: /tmp/cargo-target/x86
        - name: 交叉编译 ARM64
          <<: *arch-job
          env:
            CARGO_TERM_COLOR: always
            RUST_BACKTRACE: "1"
            QT_ARCH: arm64
            QT_TARGET: aarch64-pc-windows-msvc
            XWIN_ARCH: aarch64
            CARGO_TARGET_DIR: /tmp/cargo-target/arm64

        - name: 签名安装包
          script: |
            set -e
            if [ -z "$QT_UPDATE_SIGNING_KEY" ]; then
              echo "::error::缺少 QT_UPDATE_SIGNING_KEY（请在仓库「设置」→「环境变量」里配置）"
              exit 1
            fi
            mkdir -p .signing
            printf '%s' "$QT_UPDATE_SIGNING_KEY" | base64 -d > .signing/ed25519.key
            chmod 600 .signing/ed25519.key
            ls -l artifacts/
            for f in artifacts/*-setup.exe; do
              node scripts/update-sign.mjs sign "$f"
              node scripts/update-sign.mjs verify "$f"
            done
            ls -l artifacts/

        - name: 生成 Release 描述
          script: |
            set -e
            node .cnb/make-release-notes.mjs artifacts release-notes.md
            cat release-notes.md

        # git:release 不支持上传附件，附件交给下一步的 cnbcool/attachments
        - name: 创建 CNB Release
          type: git:release
          options:
            title: 轻听 $CNB_BRANCH
            descriptionFromFile: release-notes.md
            overlying: false
            latest: "true"

        - name: 上传安装包与签名文件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            tag: $CNB_BRANCH
            token: $CNB_TOKEN
            attachments:
              - "./artifacts/*-setup.exe"
              - "./artifacts/*-setup.exe.sig"

# ===== 探针（ci-probe-x64 分支专用，验证完删除）=====
# 只验证「自定义镜像 + cargo-xwin 交叉编译三架构」这条最贵的链路能否跑通，
# 不做签名、不发布 Release，因此不需要 QT_UPDATE_SIGNING_KEY。
ci-probe-x64:
  push:
    - name: 探针 x86+ARM64 交叉编译
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      git:
        lfs: false
        submodules: false
      docker:
        build:
          dockerfile: .cnb/windows-build.Dockerfile
          by:
            - .cnb/windows-build.Dockerfile
          versionBy:
            - .cnb/windows-build.Dockerfile
      stages:
        - name: 环境自检
          script: |
            set -e
            node -v
            pnpm -v
            rustc -V
            cargo -V
            echo "--- installed rust targets ---"
            rustup target list --installed
            echo "--- nsis ---"
            makensis -VERSION
            ls /usr/share/nsis/Stubs | head -3
            ls /usr/share/nsis/Plugins/x86-unicode | head -3
            echo "--- llvm 工具（找 mt.exe 替身用）---"
            ls /usr/lib/llvm-*/bin/ 2>/dev/null | sort | head -60 || true
            for t in llvm-mt llvm-cvtres llvm-rc clang-cl lld-link llvm-lib; do
              printf '%-14s -> %s\n' "$t" "$(command -v $t || echo '(缺失)')"
            done
        - name: 装依赖并构建前端
          script: |
            set -e
            pnpm install --frozen-lockfile
            pnpm build
            test -f dist/index.html
            echo "dist 就绪"
        # 串行两架构：x64 已在 probe7 通过（且本次源码改动是宽度无关的 as _ 转换），
        # 探针只验尚未通过的 x86 与从未跑过的 ARM64。并行会争抢 cargo-xwin 缓存。
        - name: 交叉编译 x86
          <<: *arch-job
          # 探针专用：覆盖锚点里的 script，让单个架构失败不中断后面的架构。
          # 正式发布流水线仍用锚点里那套（失败即停，避免发出残缺的 Release）。
          script: |
            set -e
            # 放在函数里再于 if 条件中调用：set -e 在条件上下文里不生效，
            # 于是函数内任何一步失败都只会让函数返回非 0，而不会终止整个 stage。
            # 代价：函数体内每一步都必须自己判失败（`|| return 1`）——否则函数返回的是
            # 最后一条命令的状态，会出现「构建早就失败了、结果却报 PASS」。
            # 这里不需要 clang 垫片：ring 那条强推 GNU clang 的分支只对 aarch64 生效，
            # i686 走 clang-cl，与 /imsvc 的问题无关。
            run_build() {
              echo "==> 构建 $QT_ARCH ($QT_TARGET)"
              pnpm exec tauri build \
                --runner cargo-xwin \
                --target "$QT_TARGET" \
                --bundles nsis \
                --config '{"build":{"beforeBuildCommand":"echo dist-already-built"}}' \
                || { echo "PROBE_STEP_FAIL tauri build"; return 1; }
              OUT="$CARGO_TARGET_DIR/$QT_TARGET/release/bundle/nsis"
              ls -l "$OUT" || { echo "PROBE_STEP_FAIL 产物目录不存在：$OUT"; return 1; }
              # 这条是判据本身：打包失败时这里没有 *-setup.exe，必须判 FAIL。
              ls -1 "$OUT"/*-setup.exe >/dev/null \
                || { echo "PROBE_STEP_FAIL $OUT 下没有 *-setup.exe"; return 1; }
              mkdir -p artifacts
              cp "$OUT"/*-setup.exe artifacts/ \
                || { echo "PROBE_STEP_FAIL 复制安装包到 artifacts/"; return 1; }
              ls -l artifacts
            }
            if run_build; then
              echo "PROBE_RESULT $QT_ARCH PASS"
            else
              echo "PROBE_RESULT $QT_ARCH FAIL"
            fi
          env:
            CARGO_TERM_COLOR: always
            RUST_BACKTRACE: "1"
            QT_ARCH: x86
            QT_TARGET: i686-pc-windows-msvc
            XWIN_ARCH: x86
            # i686 必须显式补 SSE2：cc-rs 1.6.0 给 clang-cl 传的是短横线形式的 "-arch:SSE2"，
            # 而 clang-cl 只认 /arch:SSE2；命令行里又带 -Wno-unused-command-line-argument，
            # 于是该参数被静默丢弃，aws-lc-sys 的 internal.h 直接 #error "x86 assembly requires SSE2"。
            # 两个写法都给：不被识别的那个会被 -Wno-unused-command-line-argument 忽略，不影响构建。
            CFLAGS: "-msse2 /arch:SSE2"
            CARGO_TARGET_DIR: /tmp/cargo-target/x86
        - name: 交叉编译 ARM64
          <<: *arch-job
          # 探针专用：覆盖锚点里的 script，让单个架构失败不中断后面的架构。
          # 正式发布流水线仍用锚点里那套（失败即停，避免发出残缺的 Release）。
          script: |
            set -e
            # Windows AArch64 上 ring 会强推 GNU 驱动 clang，而 cargo-xwin 给的是
            # clang-cl 风格的 /imsvc，GNU clang 不认 → 启用 .cnb/clang-shim.sh 垫片。
            # 原因细节见 .arch-job 里的注释与 .cnb/clang-shim.sh 顶部。
            case "$QT_TARGET" in
              aarch64-*)
                QT_REAL_CLANG="$(command -v clang)"
                test -n "$QT_REAL_CLANG"
                install -D -m 0755 .cnb/clang-shim.sh /tmp/clang-shim/clang
                install -D -m 0755 .cnb/clang-shim.sh /tmp/clang-shim/clang-cl
                export QT_REAL_CLANG
                export PATH="/tmp/clang-shim:$PATH"
                echo "==> clang 垫片已启用（clang + clang-cl），转发到 $QT_REAL_CLANG"; export QT_SHIM_LOG=/tmp/clang-shim.log; sh .cnb/diag-arm64.sh || true; trap 'echo "--- shim 日志：走 GNU 驱动的 .S 调用 ---"; grep -- "\.S" /tmp/clang-shim.log 2>/dev/null | head -20' EXIT
                ;;
            esac
            # 放在函数里再于 if 条件中调用：set -e 在条件上下文里不生效，
            # 于是函数内任何一步失败都只会让函数返回非 0，而不会终止整个 stage。
            # 代价：函数体内每一步都必须自己判失败（`|| return 1`）——否则函数返回的是
            # 最后一条命令的状态，会出现「构建早就失败了、结果却报 PASS」。
            run_build() {
              echo "==> 构建 $QT_ARCH ($QT_TARGET)"
              pnpm exec tauri build \
                --runner cargo-xwin \
                --target "$QT_TARGET" \
                --bundles nsis \
                --config '{"build":{"beforeBuildCommand":"echo dist-already-built"}}' \
                || { echo "PROBE_STEP_FAIL tauri build"; return 1; }
              OUT="$CARGO_TARGET_DIR/$QT_TARGET/release/bundle/nsis"
              ls -l "$OUT" || { echo "PROBE_STEP_FAIL 产物目录不存在：$OUT"; return 1; }
              # 这条是判据本身：打包失败时这里没有 *-setup.exe，必须判 FAIL。
              ls -1 "$OUT"/*-setup.exe >/dev/null \
                || { echo "PROBE_STEP_FAIL $OUT 下没有 *-setup.exe"; return 1; }
              mkdir -p artifacts
              cp "$OUT"/*-setup.exe artifacts/ \
                || { echo "PROBE_STEP_FAIL 复制安装包到 artifacts/"; return 1; }
              ls -l artifacts
            }
            if run_build; then
              echo "PROBE_RESULT $QT_ARCH PASS"
            else
              echo "PROBE_RESULT $QT_ARCH FAIL"
            fi
          env:
            CARGO_TERM_COLOR: always
            RUST_BACKTRACE: "1"
            QT_ARCH: arm64
            QT_TARGET: aarch64-pc-windows-msvc
            XWIN_ARCH: aarch64
            CARGO_TARGET_DIR: /tmp/cargo-target/arm64
