name: Release

# 打 tag（v*）才发版：三平台构建 → ed25519 签名（仅 Windows 自装更新用）→
# 上传 GitHub Release。普通 push 只跑 ci.yml 的测试门，不出包。
# 产物分工：
#   - Windows：NSIS 安装包（应用内自装更新链路，ed25519 签名 + .sig）
#   - Linux：deb + AppImage（无应用内自装，浏览器下载手动安装）
#   - macOS：dmg（无签名无公证：首次打开右键 → 打开，或
#     xattr -dr com.apple.quarantine QuietMusic.app）
# 前置一次性配置（见 docs/PACKAGING.md「自动发版」）：
#   仓库 secret QT_UPDATE_SIGNING_KEY = .signing/ed25519.key 的 base64
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ---------- Windows：NSIS 安装包 + ed25519 签名（不变的主链路） ----------
  windows:
    name: Windows NSIS 构建 + 签名 + 发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 app.config.json 的版本一致
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.TrimStart('v')
          $cfg = Get-Content app.config.json -Raw | ConvertFrom-Json
          if ($tag -ne $cfg.version.name) {
            Write-Error "tag($env:TAG) 与 app.config.json version.name($($cfg.version.name)) 不一致，先改版本号再打 tag"
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 测试不过不发版
      - run: pnpm test

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Rust 测试不过不发版（ci.yml 常跑，但 tag 可能从没进过 CI 的提交打出——
      # 2026-10-08 审计补充：发版门此前只挡了前端测试）
      - name: Run cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 本机 pnpm tauri build 有 argv0 解析 bug；`pnpm exec + --runner cargo`
      # 是 docs/PACKAGING.md 步骤 2 验证过的路径（CI 上同样成立）
      - name: 构建 NSIS 安装包
        run: pnpm exec tauri build --runner cargo

      - name: 恢复签名私钥
        shell: pwsh
        env:
          QT_UPDATE_SIGNING_KEY: ${{ secrets.QT_UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:QT_UPDATE_SIGNING_KEY)) {
            Write-Error "缺少 secret QT_UPDATE_SIGNING_KEY（.signing/ed25519.key 的 base64），配置方法见 docs/PACKAGING.md「自动发版」"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path .signing | Out-Null
          [IO.File]::WriteAllBytes("$PWD/.signing/ed25519.key", [Convert]::FromBase64String($env:QT_UPDATE_SIGNING_KEY))

      - name: ed25519 签名并自验
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "没找到 NSIS 安装包产物"; exit 1 }
          node scripts/update-sign.mjs sign $exe
          node scripts/update-sign.mjs verify $exe
          "INSTALLER=$exe" >> $env:GITHUB_ENV

      - name: 发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $hash = (Get-FileHash $env:INSTALLER -Algorithm MD5).Hash.ToLower()
          $size = (Get-Item $env:INSTALLER).Length
          $file = Split-Path $env:INSTALLER -Leaf
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$file"
          # 注意：here-string 结束符 "@ 必须顶格（YAML 剥离缩进后正好处在行首），
          # 且不能写成 `"@ | Set-Content ... -Value`——悬空的 -Value 会因缺参数直接绑定失败。
          $notes = @"
          ## 安装包信息（建后端更新记录用）

          - Windows NSIS 下载地址：$url
          - MD5：$hash
          - fileSize：$size
          - Linux/macOS 产物见附件（无应用内自装，浏览器下载手动安装）

          ### macOS 未公证说明

          首次打开：右键 App → 「打开」→ 再点「打开」（仅首次）；或终端执行
          `xattr -dr com.apple.quarantine /Applications/QuietMusic.app`
          "@
          Set-Content -Path release-notes.md -Value $notes
          # 同一个 tag 重新发布（例如重指 tag 后重跑）时，旧 Release 已存在会让 create 以
          # already_exists 失败；先删掉同名 Release 再重建（--cleanup-tag=false 保留 tag 本身）。
          # Windows 是三平台里唯一「建 Release」的 job，其余平台只 upload。
          $existing = gh release view $env:TAG --json id --jq ".id" 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Release $env:TAG 已存在（id=$existing），先删除再重建"
            gh release delete $env:TAG --yes --cleanup-tag=false
          }
          gh release create $env:TAG "$env:INSTALLER" "$env:INSTALLER.sig" --notes-file release-notes.md --generate-notes --title "轻听 $($env:TAG.TrimStart('v'))"

  # ---------- Linux：deb + AppImage ----------
  linux:
    name: Linux deb + AppImage
    runs-on: ubuntu-22.04
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (deb + appimage)
        run: pnpm exec tauri build --runner cargo --bundles deb,appimage

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls src-tauri/target/release/bundle/
          gh release upload "$TAG" src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage --clobber

  # ---------- macOS：dmg（无签名 / 无公证） ----------
  macos:
    name: macOS dmg（无公证）
    runs-on: macos-14
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (app + dmg)
        run: pnpm exec tauri build --runner cargo --bundles app,dmg

      # 不做 Developer ID 签名 / 公证（决策：不公签）。
      # tauri build 对 macOSPrivateApi 构建会自动做 ad-hoc 签名
      # （codesign -）；本地运行前如遇 Gatekeeper 拦截，见 Release 说明。
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls src-tauri/target/release/bundle/
          gh release upload "$TAG" src-tauri/target/release/bundle/dmg/*.dmg --clobber
