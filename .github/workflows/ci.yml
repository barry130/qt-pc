name: CI

on:
  # 所有分支的 push 都跑（不限 main/master）：三平台矩阵是移植新增的
  # 验证面，cfg 分支多，必须在合入 master 之前就在真实 Linux / macOS
  # 上编译过。仓库是公开仓库，Actions 分钟数不计费。
  # branches: ["**"] 而不是不写：不写会连 tag push 也一起跑。
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: 前端 typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint 门禁（eslint.config.js，只收正确性规则）：rules-of-hooks /
      # 未用变量 / 死赋值 / 正则转义 / preserve-caught-error 等。先于
      # typecheck 跑：失败定位最快。
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 泄漏护栏：自有域名 / 生产后端地址 / 官网地址**只能**待在被忽略的
      # app.config.local.json 与 private_config.rs 里。这两个文件不提交，
      # 所以这里扫的是真的进了仓库的那份内容。任何人手滑把生产地址写回
      # app.config.json、注释或测试夹具，这一步直接红。
      # 刻意不把域名写进本文件（否则这个 workflow 自己就成了泄漏点）。
      - name: 公开仓库不得出现自有地址
        run: |
          if git grep -n -I -E 'canace\.(cn|icu)' -- . ':(exclude)pnpm-lock.yaml'; then
            echo "::error::仓库里出现了自有域名，请改写到 app.config.local.json（见 docs/CONFIG.md）"
            exit 1
          fi
          echo "OK：没有自有域名"

  # 三平台编译 + 测试：Windows（主发布目标）之外，Linux/macOS
  # 是移植新增的验证面——cfg 分支多，必须每个平台都真编译过。
  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 工具链**刻意钉住版本**，不用 @stable 浮动：
      # clippy 的 lint 集随工具链变，@stable 一升版（每 6 周一次）就会在
      # 代码一行没动的情况下把 -D warnings 打红 —— 上一次就是这么红的
      # （run 41/42：本地 1.98.1 全绿，CI 的 stable 已经是 1.99.1，
      #  新增的 clippy::single_element_loop 命中 db/migrations.rs）。
      # 升级工具链改成一次有意识的动作：本地 `rustup update stable` 后
      # 跑一遍 clippy，绿了再改这里这一行。
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      # Linux：Tauri 2 需要 webkit2gtk-4.1 + libayatana-appindicator（托盘）。
      # Ubuntu 22.04+ 才有 webkit2gtk-4.1（4.0 已随 21.04 退役）。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 私有值不提交，`src/private_config.rs` 缺失时由 `src-tauri/build.rs` 补空壳，
      # 所以这里**不需要**任何注入就能编译 —— 这样 CI 才是在验证"公开仓库形态"，
      # 而不是被开发机上残留的私有文件蒙混过去。
      # clippy 门禁：存量已清零（评审修复批次落盘），-D warnings 拦截新代码。
      # 刻意**不**加 rustfmt --check 门禁：存量是统一的手写风格，一次全量
      # 重排会产生 124 处/约 30 文件的纯格式 diff，与「增量修改不重排旧代码」
      # 约定冲突（同前端不引 Prettier 的决策）。
      - name: Run cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
