name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: 前端 typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # 三平台编译 + 测试：Windows（主发布目标）之外，Linux/macOS
  # 是移植新增的验证面——cfg 分支多，必须每个平台都真编译过。
  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Linux：Tauri 2 需要 webkit2gtk-4.1 + libayatana-appindicator（托盘）。
      # Ubuntu 22.04+ 才有 webkit2gtk-4.1（4.0 已随 21.04 退役）。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
